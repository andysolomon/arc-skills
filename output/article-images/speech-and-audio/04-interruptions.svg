<text x="72" y="388" font-size="34" font-family="Georgia" font-style="italic" >A conversation needs a way to stop.</text>
<text x="72" y="465" font-size="18" font-family="Courier New" letter-spacing="1.4" fill="#777971">A CASCADED VOICE ASSISTANT</text><rect x="72" y="505" width="262" height="133" fill="none" stroke="#181916" stroke-width="2"/><text x="203" y="557" font-size="27" text-anchor="middle" font-weight="700">TRANSCRIBE</text><text x="203" y="601" font-size="24" text-anchor="middle">speech → text</text><line x1="351" y1="570" x2="391" y2="570" stroke="#181916" stroke-width="3" marker-end="url(#black)"/><rect x="409" y="505" width="262" height="133" fill="none" stroke="#181916" stroke-width="2"/><text x="540" y="557" font-size="27" text-anchor="middle" font-weight="700">REASON</text><text x="540" y="601" font-size="24" text-anchor="middle">language model</text><line x1="688" y1="570" x2="728" y2="570" stroke="#181916" stroke-width="3" marker-end="url(#black)"/><rect x="746" y="505" width="262" height="133" fill="none" stroke="#181916" stroke-width="2"/><text x="877" y="557" font-size="27" text-anchor="middle" font-weight="700">SPEAK</text><text x="877" y="601" font-size="24" text-anchor="middle">text → audio</text><rect x="323" y="704" width="434" height="66" fill="#E8EAFE" stroke="#4050FF" stroke-width="2"/><text x="540" y="747" font-size="26" text-anchor="middle" font-weight="700" fill="#4050FF">USER STARTS SPEAKING</text><path d="M540 777 L540 805 L275 805 L275 841 M540 805 L805 805 L805 841" fill="none" stroke="#4050FF" stroke-width="3" marker-end="url(#blue)"/><line x1="275" y1="805" x2="275" y2="841" stroke="#4050FF" stroke-width="3" marker-end="url(#blue)"/><text x="275" y="887" font-size="30" text-anchor="middle" font-weight="700">Cancel generation</text><text x="805" y="887" font-size="30" text-anchor="middle" font-weight="700">Stop playback</text><text x="540" y="966" font-size="36" font-family="Georgia" font-style="italic" text-anchor="middle" fill="#4050FF">Return to listening.</text>
<line x1="72" y1="1010" x2="1008" y2="1010" stroke="#D7D9D1" stroke-width="2" /><text x="72" y="1048" font-size="17" font-family="Courier New" letter-spacing="1.4" fill="#4050FF">ENGINEERING NOTE</text>
